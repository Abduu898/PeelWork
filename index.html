<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Board - Home</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- 1. NAVBAR -->
  <div id="site-navigation"></div>

  <!-- 2. HERO SECTION & SEARCH BAR -->
  <header class="py-5 text-center border-bottom border-2 border-dark bg-white">
    <div class="container my-4">
      <h1 class="display-3 fw-black mb-2" style="font-weight: 900; letter-spacing: -1px;">Find your tribe.</h1>
      <p class="fs-5 text-muted mb-5 fw-medium">Discover tech companies that match your vibe.</p>
      
      <!-- Search Bar -->
      <form id="job-search" role="search" class="p-2 bg-white search-box mx-auto" style="max-width: 800px;">
        <div class="row g-2 align-items-center">
          <div class="col-md-5">
            <div class="input-group">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search text-dark fs-5"></i></span>
              <input type="text" class="form-control border-0 shadow-none fw-medium" name="q" aria-label="Job title, tech stack, or keyword" maxlength="200" placeholder="Job title, tech stack, or keyword">
            </div>
          </div>
          <div class="col-md-4 border-start-md">
            <div class="input-group">
              <span class="input-group-text bg-white border-0"><i class="bi bi-geo-alt text-dark fs-5"></i></span>
              <input type="text" class="form-control border-0 shadow-none fw-medium" name="location" aria-label="Location" maxlength="200" placeholder="Paris, France or Remote">
            </div>
          </div>
          <div class="col-md-3">
            <button type="submit" class="btn btn-yellow py-2.5 w-100">Search</button>
          </div>
        </div>
      </form>
    </div>
  </header>

  <!-- 3. JOB LISTINGS SECTION -->
  <main class="py-5 flex-grow-1">
    <div class="container">
      
      <!-- Section Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="h3 fw-bold mb-0">Latest Opportunities</h2>
          <p class="text-muted small mb-0 fw-medium">Explore hand-picked tech positions</p>
        </div>
        <span id="job-count" class="custom-badge-dark px-3 py-2 fs-6">Loading…</span>
      </div>

      <p id="jobs-status" class="text-muted fw-medium" role="status" aria-live="polite">Loading opportunities…</p>
      <noscript><p>Enable JavaScript to load and search job opportunities.</p></noscript>
      <div id="job-grid" class="row row-cols-1 row-cols-md-3 g-4" aria-busy="true"></div>
      <section id="job-details" class="custom-card p-4 p-md-5 mt-4" tabindex="-1" aria-label="Job details" hidden>
        <div class="d-flex justify-content-end mb-3">
          <button id="close-details" type="button" class="btn btn-outline-dark btn-sm">Close details</button>
        </div>
        <div id="job-details-content"></div>
        <a id="open-job-page" class="btn btn-yellow mt-4" hidden>Open job page</a>
      </section>
    </div>
  </main>

  <!-- 4. FOOTER -->
  <div id="site-footer"></div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/components/shell.js"></script>
  <script type="module" src="js/pages/board.js"></script>
</body>
</html>
