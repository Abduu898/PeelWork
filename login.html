<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Board - Authentication</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- 1. NAVBAR -->
  <nav class="navbar navbar-expand-lg py-3">
    <div class="container">
      <a class="navbar-brand fw-extrabold fs-4 d-flex align-items-center gap-2" href="index.html">
        <span class="brand-logo-bg"><i class="bi bi-briefcase-fill"></i></span>
        <span class="fw-bold tracking-tight">JobBoard</span>
      </a>
      <button class="navbar-toggler border-2 border-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center gap-2 mt-3 mt-lg-0">
          <li class="nav-item"><a class="nav-link fw-semibold text-dark" href="index.html">Find Jobs</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold text-dark active" href="login.html">Login</a></li>
          <li class="nav-item ms-lg-2 w-100 w-lg-auto">
            <a class="btn btn-yellow px-4 w-100" href="admin.html">Post a Job</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 2. AUTHENTICATION CONTAINER -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 480px;">
      
      <div class="custom-card p-4 p-md-5">
        
        <!-- Header -->
        <div class="text-center mb-4">
          <h1 class="h3 fw-extrabold mb-1" style="font-weight: 800;">Welcome back</h1>
          <p class="text-muted small fw-medium">Join thousands of tech talents and hiring companies</p>
        </div>

        <!-- Bootstrap Nav Tabs (Toggle Login / Register) -->
        <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light border border-2 border-dark rounded-3 auth-tabs" id="authTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold text-dark rounded-2" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">
              Sign In
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold text-dark rounded-2" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">
              Register
            </button>
          </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="authTabContent">
          
          <!-- TAB 1: LOGIN FORM -->
          <div class="tab-pane fade show active" id="login-pane" role="tabpanel" aria-labelledby="login-tab">
            <form>
              <div class="mb-3">
                <label for="loginEmail" class="form-label fw-bold small">Email address</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
              </div>
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="loginPassword" class="form-label fw-bold small mb-0">Password</label>
                  <a href="#" class="text-muted small text-decoration-none">Forgot?</a>
                </div>
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
              </div>
              <div class="form-check mb-4">
                <input class="form-check-input border-2 border-dark" type="checkbox" id="rememberMe">
                <label class="form-check-label small fw-medium" for="rememberMe">Remember me for 30 days</label>
              </div>
              <button type="submit" class="btn btn-yellow w-100 py-2.5">Sign In</button>
            </form>
          </div>

          <!-- TAB 2: REGISTER FORM -->
          <div class="tab-pane fade" id="register-pane" role="tabpanel" aria-labelledby="register-tab">
            <form>
              <!-- Role Selector -->
              <div class="mb-3">
                <label class="form-label fw-bold small d-block">I want to...</label>
                <div class="btn-group w-100" role="group">
                  <input type="radio" class="btn-check" name="roleOptions" id="roleCandidate" checked>
                  <label class="btn btn-outline-dark fw-bold btn-sm py-2" for="roleCandidate">Find a Job</label>
                  
                  <input type="radio" class="btn-check" name="roleOptions" id="roleEmployer">
                  <label class="btn btn-outline-dark fw-bold btn-sm py-2" for="roleEmployer">Hire Talent</label>
                </div>
              </div>

              <div class="mb-3">
                <label for="regName" class="form-label fw-bold small">Full Name</label>
                <input type="text" class="form-control" id="regName" placeholder="Jane Doe" required>
              </div>
              <div class="mb-3">
                <label for="regEmail" class="form-label fw-bold small">Work Email</label>
                <input type="email" class="form-control" id="regEmail" placeholder="jane@company.com" required>
              </div>
              <div class="mb-4">
                <label for="regPassword" class="form-label fw-bold small">Create Password</label>
                <input type="password" class="form-control" id="regPassword" placeholder="Minimum 8 characters" required>
              </div>
              <button type="submit" class="btn btn-yellow w-100 py-2.5">Create Account</button>
            </form>
          </div>

        </div>

      </div>

    </div>
  </main>

  <!-- 3. FOOTER -->
  <footer class="bg-white border-top border-2 border-dark py-4 mt-auto">
    <div class="container text-center text-md-between d-md-flex align-items-center">
      <p class="mb-2 mb-md-0 text-dark fw-medium small">&copy; 2026 JobBoard. All rights reserved.</p>
      <div>
        <a href="#" class="text-dark fw-semibold text-decoration-none small me-3">Privacy Policy</a>
        <a href="#" class="text-dark fw-semibold text-decoration-none small">Terms of Service</a>
      </div>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
