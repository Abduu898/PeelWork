<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeelWork — Find jobs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <div id="site-navigation"></div>
  <main class="flex-grow-1">
    <section class="jobs-page-heading border-bottom border-3 border-dark">
      <div class="container py-5">
        <div class="section-eyebrow">The Vibe</div>
        <h1 class="display-5 fw-black mt-2 mb-2">Find a role worth your time.</h1>
        <p class="text-secondary fw-medium mb-0">Search open positions, narrow the list, and open the ones that feel promising.</p>
      </div>
    </section>
    <section class="jobs-browser py-5">
      <div class="container">
        <form id="job-search" role="search" class="jobs-filter-panel cartoon-card p-3 p-lg-4 mb-4">
          <div class="row g-3">
            <div class="col-lg-5"><label class="form-label small fw-bold" for="job-keyword">What</label><div class="input-group"><span class="input-group-text bg-white border-2 border-dark"><i class="bi bi-search"></i></span><input id="job-keyword" type="search" class="form-control" name="q" maxlength="200" placeholder="Job title, skill, or keyword"></div></div>
            <div class="col-lg-3"><label class="form-label small fw-bold" for="job-location">Where</label><div class="input-group"><span class="input-group-text bg-white border-2 border-dark"><i class="bi bi-geo-alt"></i></span><input id="job-location" type="search" class="form-control" name="location" maxlength="200" placeholder="City or remote"></div></div>
            <div class="col-lg-2"><label class="form-label small fw-bold" for="job-category">Category</label><select id="job-category" class="form-select" name="category"><option value="">All categories</option></select></div>
            <div class="col-lg-2"><label class="form-label small fw-bold" for="job-contract">Job type</label><select id="job-contract" class="form-select" name="contract"><option value="">All types</option><option>CDI</option><option>CDD</option><option>Freelance</option><option>Internship</option><option>Remote</option></select></div>
            <div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-2"><p class="small text-muted mb-0">Filter by role, place, category, or contract type.</p><button type="submit" class="btn btn-yellow px-4">Search jobs <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i></button></div>
          </div>
        </form>
        <div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="h4 fw-black mb-1">Open opportunities</h2><p id="jobs-status" class="text-muted small fw-medium mb-0" role="status" aria-live="polite">Loading jobs…</p></div><span id="job-count" class="custom-badge-dark px-3 py-2">Loading…</span></div>
        <div id="job-grid" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" aria-busy="true"></div>
        <section id="job-details" class="custom-card p-4 p-md-5 mt-4" tabindex="-1" aria-label="Job details" hidden><div class="d-flex justify-content-end mb-3"><button id="close-details" type="button" class="btn btn-outline-dark btn-sm">Close details</button></div><div id="job-details-content"></div><a id="open-job-page" class="btn btn-yellow mt-4" hidden>Open job page</a></section>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/components/shell.js"></script>
  <script type="module" src="js/pages/board.js"></script>
</body>
</html>
