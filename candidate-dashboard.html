<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobBoard — My dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <div id="site-navigation"></div>
  <main class="flex-grow-1 py-5">
    <div class="container">
      <p class="small text-muted fw-medium mb-4" role="note">Candidate dashboard · Track your applications.</p>
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
          <h1 class="h2 fw-bold mb-1">Welcome, <span id="candidate-name">candidate</span></h1>
          <p id="candidate-email" class="text-muted small fw-semibold mb-0"></p>
        </div>
        <a href="jobs.html" class="btn btn-yellow px-4 py-2"><i class="bi bi-search me-1" aria-hidden="true"></i> Find jobs</a>
      </div>
      <div class="row g-3 mb-5">
        <div class="col-md-4"><div class="cartoon-card custom-card dashboard-metric-card p-4"><span class="text-muted small fw-bold text-uppercase">Applications</span><div id="application-count" class="fs-2 fw-bold my-1">—</div><span class="text-muted small fw-medium">Submitted applications</span></div></div>
        <div class="col-md-4"><div class="cartoon-card custom-card dashboard-metric-card p-4"><span class="text-muted small fw-bold text-uppercase">In review</span><div id="review-count" class="fs-2 fw-bold my-1">—</div><span class="text-muted small fw-medium">Applications being reviewed</span></div></div>
        <div class="col-md-4"><div class="cartoon-card custom-card dashboard-metric-card p-4"><span class="text-muted small fw-bold text-uppercase">Next step</span><div id="next-step" class="fs-4 fw-bold my-1">—</div><span class="text-muted small fw-medium">Latest application status</span></div></div>
      </div>
      <section class="cartoon-card custom-card p-4" aria-labelledby="applications-heading">
        <h2 id="applications-heading" class="h5 fw-bold mb-2">My applications</h2>
        <p id="dashboard-feedback" class="preview-feedback small mb-4" role="status" hidden></p>
        <div id="candidate-applications" class="d-grid gap-3"></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/components/shell.js"></script>
  <script type="module" src="js/pages/candidate-dashboard.js"></script>
</body>
</html>
